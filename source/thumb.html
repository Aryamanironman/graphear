<!doctype html>
<html><head><meta charset="utf-8"><style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:1500px;height:1000px;overflow:hidden;background:#060709;
    font-family:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif;color:#F4F1EA}
  .stage{position:absolute;inset:0;padding:58px 64px;display:flex;flex-direction:column;
    background:radial-gradient(900px 620px at 14% -10%, rgba(111,247,200,.10), transparent 62%),
               radial-gradient(700px 520px at 108% 108%, rgba(120,140,255,.06), transparent 60%)}
  .top{display:flex;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:14px}
  .mark{width:44px;height:44px;border-radius:13px;border:1px solid rgba(111,247,200,.32);
    background:linear-gradient(160deg,rgba(111,247,200,.22),rgba(111,247,200,.04));display:grid;place-items:center}
  .brand b{font-size:22px;letter-spacing:-.02em;font-weight:600}
  .brand span{display:block;font-size:11px;color:#8E949C;letter-spacing:.12em;text-transform:uppercase;margin-top:2px}
  .tag{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:#6B727B}
  .tag b{color:#6FF7C8;font-weight:500}
  h1{font-size:118px;line-height:.96;letter-spacing:-.05em;font-weight:600;margin-top:86px}
  h1 em{font-style:normal;color:#6FF7C8}
  .sub{font-size:27px;color:#B9C0C8;margin-top:26px;letter-spacing:-.01em}
  .chips{display:flex;gap:10px;margin-top:30px}
  .chip{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8E949C;
    border:1px solid rgba(244,241,234,.12);border-radius:999px;padding:8px 13px;background:rgba(255,255,255,.03)}
  .map{display:flex;margin-top:104px;border-top:1px solid rgba(244,241,234,.1);max-width:1180}
  .map div{flex:1;padding:20px 28px 0 0}
  .map b{display:block;font-size:10.5px;letter-spacing:.18em;color:#6B727B;text-transform:uppercase;margin-bottom:7px}
  .map span{font-size:20px;color:#DCD9D2;letter-spacing:-.01em}
  .map em{font-style:normal;color:#6FF7C8}
  .chart{position:absolute;left:0;right:0;bottom:0;height:250px}
  svg{display:block;width:100%;height:100%}
  .grad{position:absolute;left:0;right:0;bottom:0;height:250px;
    background:linear-gradient(180deg,rgba(6,7,9,0),rgba(6,7,9,.2));pointer-events:none}
</style></head>
<body>
<div class="stage">
  <div class="top">
    <div class="brand">
      <div class="mark"><svg width="24" height="24" viewBox="0 0 22 22" fill="none">
        <rect x="3" y="9" width="2.6" height="9" rx="1.3" fill="#6FF7C8" opacity=".55"/>
        <rect x="8" y="4" width="2.6" height="14" rx="1.3" fill="#6FF7C8" opacity=".85"/>
        <rect x="13" y="7" width="2.6" height="11" rx="1.3" fill="#6FF7C8" opacity=".65"/>
        <rect x="18" y="11" width="1.6" height="7" rx=".8" fill="#6FF7C8" opacity=".4"/>
      </svg></div>
      <div><b>GraphEar</b><span>Accessible data sonification</span></div>
    </div>
    <div class="tag">Built for <b>STEMergent Hacks 2026</b></div>
  </div>
  <h1>Hear your <em>data.</em></h1>
  <p class="sub">Any CSV becomes sound, plain language, and a tactile print.</p>
  <div class="chips"><span class="chip">Sonification</span><span class="chip">Description</span><span class="chip">Tactile SVG</span></div>
  <div class="map">
    <div><b>Pitch</b><span>value becomes <em>height</em></span></div>
    <div><b>Time</b><span>sample order becomes <em>rhythm</em></span></div>
    <div><b>Pan</b><span>series becomes <em>left and right</em></span></div>
  </div>
</div>
<div class="chart">
  <svg viewBox="0 0 1500 250" preserveAspectRatio="none" id="c"><defs>
    <linearGradient id="a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6FF7C8" stop-opacity=".18"/><stop offset="1" stop-color="#6FF7C8" stop-opacity="0"/></linearGradient>
  </defs><path id="area" fill="url(#a)"></path><path id="line" fill="none" stroke="#6FF7C8" stroke-width="2.5"></path><circle id="sp" r="5" fill="#FF9A6B"></circle></svg>
</div>
<script>
  var n=64,a=[],i;
  for(i=0;i<n;i++){
    var base=318+82*(i/(n-1)), w=Math.sin(i/3.1)*3.2+Math.sin(i/7.4)*1.44, v=base+w;
    if(i===47)v+=26; a.push(v);
  }
  var lo=Math.min.apply(null,a)-6,hi=Math.max.apply(null,a)+6;
  function X(i){return 40+(i/(n-1))*(1500-80)}
  function Y(v){return 40+((hi-v)/(hi-lo))*(250-70)}
  var d=a.map(function(v,j){return (j?'L':'M')+X(j).toFixed(1)+' '+Y(v).toFixed(1)}).join(' ');
  document.getElementById('line').setAttribute('d',d);
  document.getElementById('area').setAttribute('d',d+' L '+X(n-1)+' 250 L '+X(0)+' 250 Z');
  var s=document.getElementById('sp'); s.setAttribute('cx',X(47)); s.setAttribute('cy',Y(a[47]));
</script>
</body></html>
